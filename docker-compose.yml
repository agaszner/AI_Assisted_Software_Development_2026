services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app  # live code reload; SQLite stays in backend/db.sqlite3
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
